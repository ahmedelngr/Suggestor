services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: suggestor
      POSTGRES_PASSWORD: suggestor_dev_only
      POSTGRES_DB: suggestor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
